<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>EdsDown</title>
<link rel="stylesheet" href="netlab.css">
<style>
  body { padding: 22px; min-width: 460px; min-height: 360px; }
  h2 { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  h2 img { width: 32px; height: 32px; }
  .card { padding: 6px 18px; }
  label { display: flex; align-items: center; gap: 10px; padding: 12px 0; color: var(--text-2); }
  label + label, .test + label { border-top: 1px solid var(--stroke); }
  input[type=number] { width: 100px; }
  .test { font-size: 12px; margin: -6px 0 8px; min-height: 18px; }
  .test.ok { color: var(--ok); } .test.err { color: var(--err); }
  .saved { color: var(--ok); font-size: 12px; height: 16px; margin: 10px 4px 0; }
</style>
</head>
<body>
  <h2><img src="icons/icon48.png" alt=""><span data-i18n="settingsTitle"></span></h2>
  <div class="glass card">
    <label><input type="checkbox" id="intercept"> <span data-i18n="captureDownloads"></span></label>
    <label><span data-i18n="ignoreSmaller"></span> <input type="number" id="minSize" min="0"> KB</label>
    <label><span data-i18n="appPort"></span> <input type="number" id="port" min="1024" max="65535"> <button class="btn ghost" id="test" data-i18n="testConnection"></button></label>
    <div class="test" id="testResult"></div>
    <label><span data-i18n="bubbleSizeLabel"></span>
      <select id="bubbleSize">
        <option value="small" data-i18n="sizeSmall"></option>
        <option value="normal" data-i18n="sizeNormal"></option>
        <option value="large" data-i18n="sizeLarge"></option>
      </select>
    </label>
  </div>
  <div class="saved" id="saved"></div>
  <script src="i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
