<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="netlab.css">
<style>
  body { width: 420px; min-height: 300px; padding: 12px; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 10px; }
  header img { width: 28px; height: 28px; }
  header b { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
  header .pill { margin-left: auto; }
  .gear { width: 32px; height: 32px; border-radius: 50%; background: var(--btn); color: var(--text-2); font-size: 16px; display: grid; place-items: center; }
  .gear:hover { background: var(--btn-hover); color: var(--text); }
  .card { padding: 10px 12px; margin-bottom: 10px; }
  .row { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-2); }
  .row + .row { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--stroke); }
  .row label { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  /* the on / off switch */
  .switch b { display: block; font-size: 13.5px; color: var(--text); }
  .switch small { display: block; color: var(--muted); font-size: 11.5px; }
  .toggle { margin-left: auto; position: relative; width: 42px; height: 24px; flex: none; cursor: pointer; }
  .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
  .toggle .knob { position: absolute; inset: 0; background: var(--btn-hover); border: 1px solid var(--stroke); border-radius: 12px; transition: background .15s; }
  .toggle .knob::before { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .toggle input:checked + .knob { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; }
  .toggle input:checked + .knob::before { transform: translateX(18px); }
  .toggle input:focus-visible + .knob { outline: 2px solid var(--blue); outline-offset: 2px; }
  body.off .dim { opacity: .45; pointer-events: none; }
  .row input[type=range] { flex: 1; accent-color: var(--accent); min-width: 0; }
  .row output { min-width: 38px; text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
  .row select { margin-left: auto; }
  .link { background: none; color: var(--accent); padding: 0 2px; font-size: 12px; font-weight: 600; }
  .link:hover { text-decoration: underline; }
  .add { display: flex; gap: 8px; }
  .add input { flex: 1; min-width: 0; }
  .note { font-size: 12px; min-height: 16px; margin: 6px 2px 0; }
  .note.ok { color: var(--ok); } .note.err { color: var(--err); }
  .note:empty { display: none; }
  h3 { display: flex; align-items: center; margin: 2px 2px 8px; }
  h3 .btn { margin-left: auto; font-size: 12px; padding: 4px 11px; text-transform: none; letter-spacing: 0; }
  .media { display: flex; gap: 10px; align-items: center; padding: 10px 12px; margin: 8px 0 0; border-radius: var(--r-md); background: var(--glass-2); border: 1px solid var(--stroke); }
  .media div { flex: 1; min-width: 0; font-weight: 600; }
  .media small { display: block; font-weight: 400; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { color: var(--muted); font-size: 13px; padding: 4px 2px; }
  .open { display: inline-block; margin-top: 10px; text-decoration: none; }
</style>
</head>
<body>
  <header class="glass">
    <img src="icons/icon32.png" alt="">
    <b>EdsDown</b>
    <span class="pill" id="status" data-i18n="checking"></span>
    <button class="gear" id="settings" data-i18n-title="settings">⚙</button>
  </header>
  <div class="glass card">
    <div class="row switch">
      <div>
        <b id="onText"></b>
        <small id="onHint"></small>
      </div>
      <label class="toggle" data-i18n-title="onOffTitle">
        <input type="checkbox" id="enabled" checked>
        <span class="knob"></span>
      </label>
    </div>
    <div class="row dim">
      <label><input type="checkbox" id="intercept"> <span data-i18n="captureDownloads"></span></label>
    </div>
  </div>
  <div class="glass card dim">
    <div class="row">
      <span data-i18n="buttonSize"></span>
      <input type="range" id="scale" min="50" max="200" step="5" value="100">
      <output id="scaleText">100%</output>
      <button class="link" id="scaleReset" data-i18n="reset" data-i18n-title="resetTitle"></button>
    </div>
    <div class="row">
      <span data-i18n="buttonStyle"></span>
      <select id="look">
        <option value="netlab" data-i18n="lookNetlab"></option>
        <option value="blue" data-i18n="lookBlue"></option>
        <option value="dark" data-i18n="lookDark"></option>
        <option value="light" data-i18n="lookLight"></option>
        <option value="green" data-i18n="lookGreen"></option>
        <option value="icon" data-i18n="lookIcon"></option>
      </select>
    </div>
  </div>
  <div class="glass card">
    <form class="add" id="addForm">
      <input type="url" id="url" data-i18n-placeholder="pasteLink" autocomplete="off" spellcheck="false">
      <button class="btn" type="submit" data-i18n="send"></button>
    </form>
    <div class="note" id="note"></div>
  </div>
  <section class="glass card dim">
    <h3><span class="label" data-i18n="mediaOnPage"></span><button class="btn" id="grab" data-i18n="grabVideo"></button></h3>
    <div id="media"><div class="empty" data-i18n="nothingYet"></div></div>
  </section>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
