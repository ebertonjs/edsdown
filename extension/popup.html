<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="netlab.css">
<style>
  body { width: 420px; min-height: 300px; padding: 12px; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 10px; }
  header img { width: 28px; height: 28px; }
  header b { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
  header .pill { margin-left: auto; }
  .gear { width: 32px; height: 32px; border-radius: 50%; background: var(--btn); color: var(--text-2); font-size: 16px; display: grid; place-items: center; }
  .gear:hover { background: var(--btn-hover); color: var(--text); }
  .card { padding: 10px 12px; margin-bottom: 10px; }
  .row { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-2); }
  .row + .row { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--stroke); }
  .row label { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .seg { display: flex; margin-left: auto; flex: none; background: var(--btn); border-radius: var(--r-pill); padding: 3px; }
  .seg button { background: transparent; color: var(--text-2); border-radius: var(--r-pill); padding: 3px 11px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .seg button:hover { color: var(--text); }
  .seg button.on { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--accent-text); }
  .add { display: flex; gap: 8px; }
  .add input { flex: 1; min-width: 0; }
  .note { font-size: 12px; min-height: 16px; margin: 6px 2px 0; }
  .note.ok { color: var(--ok); } .note.err { color: var(--err); }
  .note:empty { display: none; }
  h3 { display: flex; align-items: center; margin: 2px 2px 8px; }
  h3 .btn { margin-left: auto; font-size: 12px; padding: 4px 11px; text-transform: none; letter-spacing: 0; }
  .media { display: flex; gap: 10px; align-items: center; padding: 10px 12px; margin: 8px 0 0; border-radius: var(--r-md); background: var(--glass-2); border: 1px solid var(--stroke); }
  .media div { flex: 1; min-width: 0; font-weight: 600; }
  .media small { display: block; font-weight: 400; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { color: var(--muted); font-size: 13px; padding: 4px 2px; }
</style>
</head>
<body>
  <header class="glass">
    <img src="icons/icon32.png" alt="">
    <b>EdsDown</b>
    <span class="pill" id="status" data-i18n="checking"></span>
    <button class="gear" id="settings" data-i18n-title="settings">⚙</button>
  </header>
  <div class="glass card">
    <div class="row">
      <label><input type="checkbox" id="intercept"> <span data-i18n="captureDownloads"></span></label>
    </div>
    <div class="row">
      <span data-i18n="buttonSize"></span>
      <div class="seg" id="sizes">
        <button data-size="small" data-i18n="sizeSmall"></button>
        <button data-size="normal" data-i18n="sizeNormal"></button>
        <button data-size="large" data-i18n="sizeLarge"></button>
      </div>
    </div>
  </div>
  <div class="glass card">
    <form class="add" id="addForm">
      <input type="url" id="url" data-i18n-placeholder="pasteLink" autocomplete="off" spellcheck="false">
      <button class="btn" type="submit" data-i18n="send"></button>
    </form>
    <div class="note" id="note"></div>
  </div>
  <section class="glass card">
    <h3><span class="label" data-i18n="mediaOnPage"></span><button class="btn" id="grab" data-i18n="grabVideo"></button></h3>
    <div id="media"><div class="empty" data-i18n="nothingYet"></div></div>
  </section>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
